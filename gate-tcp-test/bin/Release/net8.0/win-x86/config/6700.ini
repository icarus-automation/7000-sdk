[auto]
Soft_Label_n=35
;读取间隔
auto_phase_read_gap=100
;半径
radius=1
;均值增加值
avg_inc=0
;命中率，命中大于或者等于这个次数才进入auto容器
hit_rate=1
;报警数据auto功能中用来判断是否为标签报警，信噪比过大即为标签报警，视为脏数据
alarm_data_snr_value=10
;读取次数   
auto_phase_read_cnt=4
;信号增加值
signal_inc=30
;数值权重，用来记录auto采集的数据中，每个数据在auto容器中的权重，权重越大，越容易被保留
value_weight=5
;最大值减少值
max_dec=0
;默认命中次数
Default_Hitcount = 7
;默认低位命中次数
Default_Low_Hitcount = 6
;默认高位命中次数
Default_High_Hitcount = 8
;默认低位信噪比
Default_Low_SNR = 8
;默认高位信噪比
Default_High_SNR = 6
;
noise_factor = 0.8